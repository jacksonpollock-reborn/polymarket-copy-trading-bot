services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: copybot
      POSTGRES_USER: bot
      POSTGRES_PASSWORD: botpass
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./docker/init.sql:/docker-entrypoint-initdb.d/init.sql
    restart: unless-stopped

  redis:
    image: redis:7-alpine
    restart: unless-stopped

  listener:
    build: .
    command: node dist/listener/index.js
    env_file: .env
    depends_on: [redis, postgres]
    restart: unless-stopped

  filter:
    build: .
    command: node dist/filter/index.js
    env_file: .env
    depends_on: [redis, postgres]
    restart: unless-stopped

  telegram:
    build: .
    command: node dist/telegram/index.js
    env_file: .env
    depends_on: [redis]
    restart: unless-stopped

  executor:
    build: .
    command: node dist/executor/index.js
    env_file: .env
    depends_on: [redis, postgres]
    restart: unless-stopped

  risk:
    build: .
    command: node dist/risk/index.js
    env_file: .env
    depends_on: [redis, postgres]
    restart: unless-stopped

  whitelist:
    build: .
    command: node dist/whitelist/server.js
    env_file: .env
    ports:
      - "3000:3000"
    depends_on: [redis, postgres]
    restart: unless-stopped

  crawler:
    build: .
    command: node dist/crawler/index.js
    env_file: .env
    environment:
      WHITELIST_URL: http://whitelist:3000
    depends_on: [whitelist, postgres]
    restart: unless-stopped

volumes:
  pgdata:
